<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Бригада Блеск · расчёт уборки</title>
  <meta name="description" content="Мини-приложение Telegram: расчёт стоимости уборки за минуту. Демо бота записи на услуги.">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="hero">
    <div class="logo-plate"><img src="assets/logo.png" alt=""></div>
    <div>
      <h1 id="bizName">Бригада Блеск</h1>
      <p>Расчёт уборки за минуту</p>
    </div>
  </header>

  <main>
    <h2>Где нужна уборка</h2>
    <div class="segmented" id="rooms"></div>

    <h2>Услуга</h2>
    <div class="services" id="services"></div>

    <section id="areaBlock" class="card">
      <div class="row">
        <h2 class="inline">Площадь</h2>
        <label class="area-input"><input id="areaNum" type="number" inputmode="numeric" min="1" max="2000" value="50" aria-label="Площадь, м²"><span class="unit">м²</span></label>
      </div>
      <input id="areaRange" type="range" min="10" max="300" step="5" value="50" aria-label="Площадь">
      <div class="range-labels"><span>10</span><span>300+</span></div>
      <p class="muted small" id="areaHint"></p>
    </section>

    <section id="addonsBlock">
      <h2 id="addonsTitle">Дополнительно</h2>
      <div id="addons"></div>
    </section>

    <section class="card" id="summaryCard">
      <div id="breakdown"></div>
      <button class="promo-link" id="promoLink" type="button">Есть промокод?</button>
      <div class="promo-box" id="promoBox" hidden>
        <input id="promo" type="text" maxlength="32" placeholder="Введите промокод" autocomplete="off" aria-label="Промокод">
        <p class="muted small">Скидка появится в чеке, когда бот подтвердит расчёт.</p>
      </div>
    </section>
  </main>

  <footer class="bar">
    <div>
      <div class="muted small">Итого</div>
      <div class="total" id="total">0 ₽</div>
      <div class="muted small" id="minHint" hidden></div>
    </div>
    <button id="fallbackBtn" class="primary" hidden>Выбрать дату</button>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
